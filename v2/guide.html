<body class="gpage">
<header class="gtop">
  <div class="gtop-in">
    <a class="gbrand" href="#/"><span>Tribute</span><span class="dot"></span><small>Hub Guide</small></a>
    <a class="back-to-hub" href="./">Open the Hub &rarr;</a>
  </div>
</header>

<main class="gdoc"><div class="gdoc-in" id="gdoc-view" tabindex="-1"></div></main>

<script src="./guide-content.js?v=314e0585"></script>
<script src="./guide-views.js?v=ed8d299c"></script>
<script>
/* The standalone page is a thin host for exactly the renderer the Hub uses.
   Somebody emailed a link gets the same guide, in the same words, laid out
   the same way — it simply has no rail around it. */
(function () {
  'use strict';
  var view = document.getElementById('gdoc-view');
  function render() {
    window.GuideViews.prefix = '#/';
    var route = (location.hash || '#/').replace(/^#\/?/, '');
    view.innerHTML = window.GuideViews.render(route);
    window.GuideViews.wireSearch(view, function (r) { location.hash = '#/' + r; });
    var frag = window.GuideViews.fragmentOf(route);
    if (frag) { var t = document.getElementById(frag); if (t) { t.scrollIntoView(); return; } }
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
